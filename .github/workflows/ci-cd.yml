###
# cache dependency path : will take some space on github cloud to store your dependencies 
# so you can use it fastly  



name: Enterprise CI/CD with devsecops
on: 
    push: 
        branches: 
            - qa
        paths: 
            - ".github/workflows/*"
            - "client/**"
            - "server/**"
    workflow_dispatch: 
jobs: 
    git-leaks-scan: 
        runs-on: ubuntu-latest 
        steps: 
            - name: checkout source code
              uses: actions/checkout@v4 
            
            - name: Install gitleaks
              uses: gitleaks/gitleaks-action@v3
            
            - name: Run git leaks and generating reports 
              run: | 
                gitleaks git --report-format json \
                    --report-path gitleaks-report.json \
                    --exit-code 0 
                
            - name: Uploading report as artifact 
              uses: actions/upload-artifact@v4 
              with: 
                name: git-leak-report
                path: |
                    gitleaks-report.json
                if-no-files-found: warn 

    checkov-scan-tf: 
        runs-on: ubuntu-latest
        needs: git-leaks-scan 
        steps: 
            - uses: actions/checkout@v4 
            - name: Installing python 
              uses: actions/setup-python@v5 
              with: 
                python-version: "3.11"
            
            - name: Install checkov 
              run: pip install checkov 
            
            - name: Run checkov terraform scan 
              run: | 
                checkov -d . \
                  -- framework terraform \
                  -- output json > checkov-terraform-report.json || true        # if the checkov tests fail still have to continue running the pipeline   
            
            - name: Uploading checkov report Artifacts 
              uses: actions/upload-artifact@v4 
              with: 
                name: checkov-terraform-report
                path: checkov-terraform-report.json 
                if-no-files-found: warn 


    checkov-scan-k8s: 
        runs-on: ubuntu-latest
        needs: git-leaks-scan 
        steps: 
            - uses: actions/checkout@v4 
            - name: Installing python 
              uses: actions/setup-python@v5 
              with: 
                python-version: "3.11"
            
            - name: Install checkov 
              run: pip install checkov 
            
            - name: Run checkov k8s scan 
              run: | 
                checkov -d . \
                  -- framework kubernetes \
                  -- output json > checkov-k8s-report.json || true        # if the checkov tests fail still have to continue running the pipeline   
            
            - name: Uploading checkov report Artifacts 
              uses: actions/upload-artifact@v4 
              with: 
                name: checkov-k8s-report
                path: checkov-k8s-report.json 
                if-no-files-found: warn

    checkov-scan-dockerfile: 
        runs-on: ubuntu-latest
        needs: git-leaks-scan 
        steps: 
            - uses: actions/checkout@v4 
            - name: Installing python 
              uses: actions/setup-python@v5 
              with: 
                python-version: "3.11"
            
            - name: Install checkov 
              run: pip install checkov 
            
            - name: Run checkov dockerfile scan 
              run: | 
                checkov -d . \
                  -- framework dockerfile \
                  -- output json > checkov-dockerfile-report.json || true        # if the checkov tests fail still have to continue running the pipeline   
            
            - name: Uploading checkov report Artifacts 
              uses: actions/upload-artifact@v4 
              with: 
                name: checkov-dockerfile-report
                path: checkov-dockerfile-report.json 
                if-no-files-found: warn



    client-trivy-fs:
        runs-on: ubuntu-latest
        needs: git-leaks-scan

        steps:
            - uses: actions/checkout@v4

            - name: Trivy filesystem scan - JSON
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                scan-ref: './client'
                format: 'json'
                output: 'client-trivy-report.json'
                severity: 'HIGH,CRITICAL'
                ignore-unfixed: true
                exit-code: '0'

            - name: Trivy filesystem scan - table
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                scan-ref: './client'
                format: 'table'
                output: 'client-trivy-table-report.txt'
                severity: 'HIGH,CRITICAL'
                ignore-unfixed: true
                exit-code: '0'
                skip-setup-trivy: true

            - name: Upload Trivy reports
              uses: actions/upload-artifact@v4
              with:
                name: client-trivy-reports
                path: |
                    client-trivy-report.json
                    client-trivy-table-report.txt
                if-no-files-found: warn 

    server-trivy-fs: 
        runs-on: ubuntu-latest 
        needs: git-leaks-scan 
        steps: 
            - uses: actions/checkout@v4 
            - name: Installing trivy scanner 
              uses: aquasecurity/trivy-action@v0.36.0
              with: 
                scan-type: 'fs'
                scan-ref: './server'
                ignore-unfixed: true
                format: 'json'
                output: 'trivy-server-fs-result.json'
                severity: 'HIGH,CRITICAL'
                exit-code: 0
            
            - name: Trivy server filesystem scan - table
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                scan-ref: './server'
                format: 'table'
                output: 'server-trivy-table-report.txt'
                severity: 'HIGH,CRITICAL'
                ignore-unfixed: true
                exit-code: '0'
                skip-setup-trivy: true

            - name: Uploading server trivy fs report 
              uses: actions/upload-artifact@v4
              with: 
                name: trivy-server-report-json
                path: | 
                    trivy-server-fs-result.json
                    server-trivy-table-report.txt
                if-no-files-found: warn 

    client-server-linting: 
        needs: 
            - client-trivy-fs
            - checkov-scan-tf
            - checkov-scan-k8s
            - checkov-scan-dockerfile
            - server-trivy-fs 
        uses: ./.github/workflows/linting_workflow.yml 

    client-test: 
        needs: client-server-linting 
        runs-on: ubuntu-latest 
        defaults: 
            run: 
                working-directory: client 
        

        steps: 
            - uses: actions/checkout@v4 
            - name: setup nodejs 
              uses: actions/setup-node@v4 
              with: 
                node-version: '20'
                cache: npm 
                cache-dependency-path: client/package-lock.json 
            - name: Installing dependencies 
              run : npm ci 
            
            - name: Running client test
              run: npm test --if-present 
              continue-on-error: true 
            
    server-test: 
        needs: client-server-linting 
        runs-on: ubuntu-latest 
        defaults: 
            run: 
                working-directory: server 
        
        steps: 
            - uses: actions/checkout@v4 
            - uses: actions/setup-node@v4 
              with: 
                node-version: 20 
                cache: npm 
                cache-dependency-path: server/package-lock.json 
            - run: npm ci 
            - run: npm test --if-present
              continue-on-error: true 
        

            
    sonarqube-scan:
        needs: 
            - client-test 
            - server-test
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
          with:
            # Disabling shallow clone is recommended for improving relevancy of reporting.
            fetch-depth: 0     # fetches the entire git history 

        # Triggering SonarQube analysis as results of it are required by Quality Gate check.
        - name: SonarQube Scan
          uses: sonarsource/sonarqube-scan-action@master
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        # Check the Quality Gate status.
        - name: SonarQube Quality Gate check
          id: sonarqube-quality-gate-check
          uses: sonarsource/sonarqube-quality-gate-action@master
          with:
            pollingTimeoutSec: 600
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} #OPTIONAL

        # Optionally you can use the output from the Quality Gate in another step.
        # The possible outputs of the `quality-gate-status` variable are `PASSED`, `WARN` or `FAILED`.
        - name: "Example show SonarQube Quality Gate Status value"
          run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"           


    client-build: 
        runs-on: ubuntu-latest 
        needs: 
            - client-test  
        defaults: 
            run: 
                working-directory: client 
        steps: 
            - uses: actions/checkout@v4 
            - uses: actions/setup-node@v4
              with: 
                node-version: 20 
                cache: npm 
                cache-dependency-path: client/package-lock.json   

            - name: Installing client dependencies 
              run: npm ci 
            
            - name: building the client 
              run: npm run build --if-present 
            
                

    docker-build-and-push: 
        runs-on: ubuntu-latest 
        needs: 
            - client-build 
            - sonarqube-scan
        
        steps: 
            - name: Checking out the source code 
              uses: actions/checkout@v4 

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
    
            - name: Building the docker Image  
              run: | 
                docker build -t ${{secrets.DOCKERHUB_USERNAME}}/nodejs-app:${{github.sha}}
              
            - name: installing trivy 
              uses: aquasecurity/trivy-action@master
              with:
                image-ref: '${{secrets.DOCKERHUB_USERNAME}}/nodejs-app:${{ github.sha }}'
                scan-type: 'image'
                format: 'table'
                exit-code: '1' # Change to '0' if you do not want to block pipeline failures
                ignore-unfixed: true # Skips vulnerabilities that don't have a patch available yet
                severity: 'CRITICAL,HIGH'
            - name: Pushing to Docker hub 
              run: | 
                docker push ${{secrets.DOCKERHUB_USERNAME}}/nodejs-app:${{github.sha}}
                echo "******************** IMAGE PUSHED SUCCESSFULLY **************************"

                
            
